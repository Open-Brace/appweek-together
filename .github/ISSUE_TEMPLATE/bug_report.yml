name: Bug report
description: Report a problem with the planner.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please omit private event details, invite links, credentials, and personal information. Report vulnerabilities through the Security tab."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone, Chrome on macOS, etc.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Where did it happen?
      options:
        - Hosted App Week Together
        - My own deployment
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or additional context
      description: Redact private information before uploading.
